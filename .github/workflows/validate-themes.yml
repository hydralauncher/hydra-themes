name: Validate Themes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: pull_request

jobs:
  validate-themes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-yarn re-checks out the repository shallowly, so diff before it runs.
      - name: List changed themes
        run: echo "CHANGED_THEMES=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- themes | cut -d/ -f2 | sort -u | paste -sd, -)" >> "$GITHUB_ENV"

      - name: Install Node.js
        uses: actions/setup-node@v4

      - uses: mskelton/setup-yarn@v3

      - name: Install dependencies
        run: yarn

      - name: Validate themes
        env:
          HYDRA_HEADER_SECRET: ${{ secrets.HYDRA_HEADER_SECRET }}
        run: |
          yarn validate-themes
